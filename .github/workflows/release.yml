name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate tag and prepare metadata
        id: metadata
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Expected a stable vX.Y.Z tag, got %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          version=$(python3 -c 'from qota import __version__; print(__version__)')
          if [[ "v${version}" != "$GITHUB_REF_NAME" ]]; then
            printf 'Tag %s does not match source version %s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          major="${version%%.*}"
          commit=$(git rev-parse HEAD)
          printf 'version=%s\nmajor=%s\ncommit=%s\n' "$version" "$major" "$commit" >> "$GITHUB_OUTPUT"

      - name: Check tag and existing GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          remote_commit=$(git ls-remote --exit-code origin "$tag_ref" "$tag_ref^{}" |
            awk -v tag="$tag_ref" '$2 == tag { object = $1 } $2 == tag "^{}" { peeled = $1 }
              END { print (peeled == "" ? object : peeled) }')
          if [[ "$remote_commit" != "$COMMIT" ]]; then
            printf 'Remote tag %s does not point to %s\n' "$GITHUB_REF_NAME" "$COMMIT" >&2
            exit 1
          fi

          response=$(mktemp)
          status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          case "$status" in
            200)
              if ! jq -e --arg tag "$GITHUB_REF_NAME" \
                '.tag_name == $tag and .draft == false and .prerelease == false' "$response" > /dev/null; then
                printf 'Existing Release %s does not match the stable tag\n' "$GITHUB_REF_NAME" >&2
                exit 1
              fi
              printf 'Release %s already exists for commit %s\n' "$GITHUB_REF_NAME" "$COMMIT"
              printf 'exists=true\n' >> "$GITHUB_OUTPUT"
              ;;
            404)
              printf 'exists=false\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf 'GitHub Release lookup failed with HTTP %s\n' "$status" >&2
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        if: steps.release.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.release.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: steps.release.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_REF=version-16
            FRAPPE_REF_KIND=branch
            QOTA_VERSION=${{ steps.metadata.outputs.version }}
            QOTA_REVISION=${{ steps.metadata.outputs.commit }}
          tags: |
            edalca/qota:${{ steps.metadata.outputs.version }}
            edalca/qota:${{ steps.metadata.outputs.major }}
            edalca/qota:latest

      - name: Publish GitHub Release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/$VERSION.md"
          notes=(--generate-notes)
          if [[ -f "$notes_file" ]]; then
            notes=(--notes-file "$notes_file")
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$COMMIT" \
            --title "QOTA $VERSION" \
            "${notes[@]}"
