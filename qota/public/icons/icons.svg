<!-- Module glyphs for the dock and sidebar headers. The drawings are Qota's.
     Paint matches the Framework soft icons: the symbol is a soft-icon, so the
     stroke is currentColor, soft-body is the 10% tint and soft-accent is the
     one 50% mark. Frappe's icons.scss supplies those classes. Hover motion
     uses icon-motion-opacity. The app mark stays logo.svg. -->
<svg id="qota-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
<style>
@media (prefers-reduced-motion: no-preference) {
.qota-bill-drop,
.qota-house-roof,
.qota-coin-front,
.qota-register-drawer,
.qota-subscriber-card {
transition: transform 0.4s cubic-bezier(0.34, 1.4, 0.64, 1);
}
.qota-bill-drop {
transform: translateY(calc(var(--icon-motion-opacity, 0) * -2px));
}
.qota-house-roof {
transform: translateY(calc(var(--icon-motion-opacity, 0) * -1.4px));
}
.qota-coin-front {
transform: translateY(calc(var(--icon-motion-opacity, 0) * -2px));
}
.qota-register-drawer {
transform: translateY(calc(var(--icon-motion-opacity, 0) * 4.2px));
}
.qota-subscriber-card {
transform: translateY(calc(var(--icon-motion-opacity, 0) * -1.6px));
}
}
</style>

<symbol id="icon-billing-drop-duotone" viewBox="0 0 24 24" class="soft-icon" style="overflow: visible">
<rect x="2.25" y="4.75" width="14.2" height="14.5" rx="2" class="soft-body"/>
<path d="M2.25 8.35h14.2"/>
<path d="M4.6 11.1h6.4M4.6 13.6h4.6M4.6 16.1h5.5"/>
<g class="qota-bill-drop">
<path d="M19.1 8.7c.26 0 3.05 3.35 3.05 5.25a3.05 3.05 0 0 1-6.1 0c0-1.9 2.8-5.25 3.05-5.25z" class="soft-accent"/>
</g>
</symbol>

<symbol id="icon-governance-house-duotone" viewBox="0 0 24 24" class="soft-icon" style="overflow: visible">
<rect x="5" y="11.8" width="14" height="8.4" rx="1.6" class="soft-body"/>
<path d="M9.8 20.15V16.2Q12 13.9 14.2 16.2V20.15"/>
<g class="qota-house-roof">
<path d="M4.8 12.2 12 4.5l7.2 7.7"/>
</g>
</symbol>

<symbol id="icon-expenditures-coin-duotone" viewBox="0 0 24 24" class="soft-icon" style="overflow: visible">
<circle cx="8.1" cy="14.8" r="4.5"/>
<circle cx="15.9" cy="10" r="4.5"/>
<g class="qota-coin-front">
<circle cx="12" cy="12.4" r="4.5" class="soft-body"/>
<circle cx="12" cy="12.4" r="1.65" class="soft-accent"/>
</g>
</symbol>

<symbol id="icon-collection-cash-duotone" viewBox="0 0 24 24" class="soft-icon" style="overflow: visible">
<path d="M7 7.15V3.8A1.25 1.25 0 0 1 8.25 2.55h7.5A1.25 1.25 0 0 1 17 3.8v3.35h1.6A1.8 1.8 0 0 1 20.4 8.95v9.7a1.8 1.8 0 0 1-1.8 1.8H5.4a1.8 1.8 0 0 1-1.8-1.8v-9.7a1.8 1.8 0 0 1 1.8-1.8H7z" class="soft-body"/>
<path d="M9.35 5.05h1.15M11.42 5.05h1.15M13.5 5.05h1.15"/>
<g class="qota-register-drawer">
<path d="M6.3 15.7h11.4"/>
<rect x="10.7" y="16.75" width="2.6" height="1.05" rx="0.5" class="soft-accent"/>
</g>
</symbol>

<symbol id="icon-subscribers-card-duotone" viewBox="0 0 24 24" class="soft-icon" style="overflow: visible">
<g class="qota-subscriber-card">
<rect x="4.2" y="3.2" width="15.6" height="17.6" rx="2.2" class="soft-body"/>
<circle cx="12" cy="9" r="2.35" class="soft-accent"/>
<path d="M7.3 17.6a4.7 4.7 0 0 1 9.4 0"/>
</g>
</symbol>
</svg>
